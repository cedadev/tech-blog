- name: William Cross
  position: Apprentice Software Engineer
  image:
  bio: |
    Will joined the Degree Apprentice Scheme in 2023, with CEDA as his home department.  Alongside working at STFC, he is also studying towards a BSc (Hons) Digital and Technology Solutions Degree.
    He has worked across several projects, including the Near-Line Data Store, data in
    the CEDA archive and exploratory work with emerging AI technologies.
- name: Neil Massey
  position: Senior Software Engineer
  image: https://www.ceda.ac.uk/img/people/neil-massey-2800x2800.webp
  bio: |
    Neil joined CEDA in 2016 after working on the climateprediction.net and weather@home projects at the University of Oxford for 12 years, during which he gained a DPhil. in Atmospheric Physics.
    At CEDA, Neil is using his experience of large datasets to develop solutions to storing and accessing the very large volume of data held on JASMIN at CEDA, both in user's group workspaces and in the archive. These solutions involve using new storage technology, such as object stores and scale-out filesystems, and novel methods to exploit existing technology such as tape and parallel file systems.
- name: Daniel Westwood
  position: Software Engineer
  image: https://www.ceda.ac.uk/img/people/daniel-westwood-2800x2800.webp
  bio: | 
    Daniel joined CEDA as a (Graduate) Software Engineer in September 2022 following graduation from the University of York with a Masters in Physics with Astrophysics. 
    His role within CEDA is primarily to develop and maintain applications for data retrieval and visualisation by users; web services to access datasets within the CEDA archive and applications to graphically visualise geospatial data.
- name: Richard Smith
  position: Senior Software Engineer
  image:
  bio: |
    Richard joined CEDA through the graduate scheme following a degree in Meteorology and Climate Science and
    develops web interfaces to improve discoverability and searchability of the data holdings at CEDA.
    He specifies in building and maintaining an Elasticsearch cluster with indices used to provide data to CEDA services.
    Richard left CEDA in 2021.
- name: Mahir Rahman
  position: Undergraduate Year-in-industry Student
  image:
  bio: |
    Mahir joins us from University of York where he is studying for a MEng in Computer Science. He joins us for his placement year.
- name: Jack Leland
  position: Software Engineer
  image: 
  bio: |
    Jack joined CEDA as a software developer in 2021 after completing a PhD in Plasma Physics at the University of Liverpool. 
    At CEDA, Jack is working on overhauling the joint-storage migration application (JDMA) to make using tape- and object-storage a more seamless process for JASMIN users.
    Jack left CEDA in 2024.